name: Update VLESS List
on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  filter_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests geoip2

      - name: Download GeoIP Database
        run: |
          # Используем стабильное зеркало
          curl -L -o country.mmdb https://github.com/Loyalsoldier/geoip/releases/latest/download/country.mmdb

      - name: Run filter script
        run: python filter.py

      - name: Commit changes
        run: |
          git config --global user.name "VLESS-Bot"
          git config --global user.email "bot@github.com"
          if [ -f valid_vless.txt ]; then
            git add valid_vless.txt
            git commit -m "Update" || exit 0
            git push
          fi
