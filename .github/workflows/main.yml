name: Update VLESS List

on:
  schedule:
    # 02:00, 03:00 и 10:00 UTC (06:00, 07:00 и 14:00 по Самаре/Тольятти)
    - cron: '0 2,3,10 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run filter
        run: python filter.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "VLESS-Bot"
          git config --global user.email "bot@github.com"
          git add valid_vless.txt
          git commit -m "Update list: $(date)" || true
          git pull origin main --rebase -X theirs
          git push origin main
