name: Update VLESS List

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов
  workflow_dispatch: # Ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run filter
        run: python filter.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "VLESS-Bot"
          git config --global user.email "bot@github.com"
          
          # 1. Сначала подготавливаем файл
          git add valid_vless.txt
          
          # 2. Делаем коммит. Если изменений нет, || true не даст экшену упасть.
          git commit -m "Auto-update: $(date)" || true
          
          # 3. Теперь подтягиваем изменения из репозитория (если они были)
          git pull origin main --rebase
          
          # 4. Отправляем в репозиторий
          git push origin main


